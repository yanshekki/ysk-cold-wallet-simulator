[package]
name = "native-proxy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8", "async"] }
napi-derive = "2"
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = "1"
once_cell = "1"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5"
core-foundation = "0.10"

[build-dependencies]
napi-build = "2"
