url: http://127.0.0.1:8788
tags:
  - proxy
  - shell
---
# Given CWS Proxy UI
# When the three tabs and language chips are used
# Then Proxy / Testnet host / Console stay reachable
- launchApp
- tapOn:
    id: "tab-proxy"
- assertVisible:
    id: "proxy-power"
- tapOn:
    id: "tab-lab"
- assertVisible:
    id: "lab-brand-ledger"
- tapOn:
    id: "tab-console"
- assertVisible:
    id: "log-filter-all"
- tapOn:
    id: "lang-select"
- tapOn: "繁 · 繁體中文（香港）"
- assertVisible: "測試網主機"
- tapOn:
    id: "lang-select"
- tapOn: "EN · English"
- tapOn:
    id: "tab-proxy"
