appId: hk.ysk.cws
tags:
  - settings
  - security
---
# Given Settings → Security
# When the biometric toggle, sign re-auth, auto-lock, and hold duration are shown
# Then the controls are tappable without leaving the screen
- runFlow: onboarding.yaml
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "settings-link-security"
- assertVisible:
    id: "security-faceid"
- tapOn:
    id: "security-faceid"
- tapOn:
    id: "security-faceid"
- assertVisible:
    id: "security-sign-reauth"
- assertVisible:
    id: "security-autolock"
- assertVisible:
    id: "security-hold-duration"
- assertVisible:
    id: "hold-duration-3"
- tapOn:
    id: "hold-duration-5"
- tapOn:
    id: "hold-duration-3"
- tapOn:
    id: "screen-back"
- assertVisible:
    id: "settings-link-security"
