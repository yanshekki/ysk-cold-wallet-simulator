appId: hk.ysk.cws
tags:
  - vault
  - import
  - error
---
# Given Device is unlocked
# When the operator pastes a checksum-invalid mnemonic
# Then Import stays on the form and submit does not create a slot
- runFlow: onboarding.yaml
- tapOn:
    id: "tab-vault"
- tapOn:
    id: "vault-import"
- extendedWaitUntil:
    visible:
      id: "import-draft"
    timeout: 15000
- tapOn:
    id: "import-draft"
- inputText: "zzzz notaword garbage payload 0000"
- tapOn:
    id: "import-submit"
    optional: true
- assertVisible:
    id: "import-draft"
- tapOn:
    id: "screen-back"
