appId: hk.ysk.coldwalletsimulator
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "disclaimer-agree"
    timeout: 15000
    optional: true
- tapOn:
    id: "disclaimer-agree"
    optional: true
- tapOn:
    id: "legal-tab-privacy"
    optional: true
- tapOn:
    id: "privacy-agree"
    optional: true
- tapOn:
    id: "disclaimer-continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-device"
    timeout: 45000
- tapOn:
    id: "tab-vault"
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "settings-link-language"
- assertVisible:
    id: "screen-back"
- tapOn:
    id: "language-open"
- assertVisible:
    id: "language-en"
- assertVisible:
    id: "language-zh-HK"
- tapOn:
    id: "language-zh-HK"
- tapOn:
    id: "screen-back"
- tapOn:
    id: "settings-link-security"
- tapOn:
    id: "screen-back"
- tapOn:
    id: "settings-link-catalog"
- assertVisible:
    id: "catalog-table"
- tapOn:
    id: "screen-back"
- tapOn:
    id: "settings-link-paths"
- tapOn:
    id: "screen-back"
- tapOn:
    id: "settings-link-data"
- assertVisible:
    id: "data-logs"
- assertVisible:
    id: "data-ble"
- assertVisible:
    id: "data-about"
- assertVisible:
    id: "data-danger"
- tapOn:
    id: "log-cap-500"
- tapOn:
    id: "screen-back"
- assertVisible:
    id: "settings-link-language"
- scrollUntilVisible:
    element:
      id: "settings-link-ysk"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "settings-link-privacy"
- assertVisible:
    id: "settings-link-disclaimer"
- assertVisible:
    id: "settings-link-ysk"
