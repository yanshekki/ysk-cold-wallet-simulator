appId: hk.ysk.cws
tags:
  - device
  - qr
---
# Given a vault seed
# When Scan QR is opened
# Then the scanner can be dismissed without a signing request
- runFlow: seed.yaml
- tapOn:
    id: "tab-device"
- scrollUntilVisible:
    element:
      id: "device-qr-scan"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "device-qr-scan"
- extendedWaitUntil:
    visible:
      id: "device-qr-scanner"
    timeout: 12000
    optional: true
- tapOn:
    id: "device-qr-scanner-close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-device"
    timeout: 15000
