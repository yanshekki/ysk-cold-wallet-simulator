appId: hk.ysk.cws
tags:
  - settings
  - security
---
# Given Settings → Data danger zone
# When WIPE is not typed exactly
# Then the wipe button stays disabled (vault is not erased)
- runFlow: onboarding.yaml
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "settings-link-data"
- scrollUntilVisible:
    element:
      id: "data-wipe"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "data-wipe"
    enabled: false
- tapOn:
    id: "data-wipe-input"
- inputText: "NOPE"
- assertVisible:
    id: "data-wipe"
    enabled: false
- tapOn:
    id: "data-wipe"
    optional: true
- assertVisible:
    id: "data-wipe-input"
- tapOn:
    id: "screen-back"
