appId: hk.ysk.cws
tags:
  - vault
  - import
  - security
---
# Given Device is unlocked
# When the operator pastes a public BIP39 test vector
# Then the form refuses the first submit (known-unsafe)
- runFlow: onboarding.yaml
- tapOn:
    id: "tab-vault"
- tapOn:
    id: "vault-import"
- extendedWaitUntil:
    visible:
      id: "import-draft"
    timeout: 15000
- tapOn:
    id: "import-draft"
- inputText: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
- tapOn:
    id: "import-submit"
- extendedWaitUntil:
    visible:
      id: "import-error"
    timeout: 15000
- assertVisible:
    id: "import-draft"
- tapOn:
    id: "screen-back"
