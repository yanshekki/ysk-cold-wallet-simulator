appId: hk.ysk.cws
tags:
  - vault
  - generate
  - security
---
# Given a debug BIP39 reveal (Maestro runs Debug, where isDevBuild() is true)
# When the operator has not typed quiz words
# Then Confirm is enabled: debug skips the word quiz so screenshot-gated QA can finish
# Release still quizzes three words (apps/mobile/src/seeds/pickVerify.test.ts)
- runFlow: onboarding.yaml
- tapOn:
    id: "tab-vault"
- tapOn:
    id: "vault-generate"
- tapOn:
    id: "generate-words-12"
- tapOn:
    id: "generate-run"
- extendedWaitUntil:
    visible:
      id: "generate-reveal"
    timeout: 30000
- assertVisible:
    id: "generate-confirm"
    enabled: true
- tapOn:
    id: "screen-back"
