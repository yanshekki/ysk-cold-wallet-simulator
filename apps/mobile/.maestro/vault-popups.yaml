appId: hk.ysk.coldwalletsimulator
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "disclaimer-agree"
    timeout: 15000
    optional: true
- tapOn:
    id: "disclaimer-agree"
    optional: true
- tapOn:
    id: "legal-tab-privacy"
    optional: true
- tapOn:
    id: "privacy-agree"
    optional: true
- tapOn:
    id: "disclaimer-continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-device"
    timeout: 45000
- extendedWaitUntil:
    visible: "開始廣播"
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "tab-vault"
- tapOn: "種子, tab, 2 of 4"
- extendedWaitUntil:
    visible:
      id: "vault-generate"
    timeout: 15000
- tapOn:
    id: "vault-import"
- extendedWaitUntil:
    visible:
      id: "import-draft"
    timeout: 15000
- tapOn:
    id: "import-draft"
- inputText: "absent much beef salmon theme settle absorb festival fancy dinner tiny flavor"
- tapOn:
    id: "import-submit"
- extendedWaitUntil:
    visible: "顯示助記詞"
    timeout: 20000
- tapOn: "顯示助記詞"
- extendedWaitUntil:
    visible:
      id: "vault-phrase-sheet"
    timeout: 20000
- assertVisible: "複製助記詞"
- takeScreenshot: phrase-overlay
- tapOn: "複製助記詞"
- assertVisible: "複製助記詞？"
- tapOn: "確認"
- tapOn:
    id: "sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "vault-phrase-sheet"
    timeout: 8000
- tapOn: "帳戶"
- assertVisible:
    id: "vault-accounts-sheet"
- extendedWaitUntil:
    notVisible: "載入中"
    timeout: 30000
- assertVisible: "Ethereum / EVM"
- takeScreenshot: accounts-overlay
- tapOn:
    id: "sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "vault-accounts-sheet"
    timeout: 15000
