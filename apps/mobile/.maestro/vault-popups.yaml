appId: hk.ysk.coldwalletsimulator
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-device"
    timeout: 45000
- extendedWaitUntil:
    visible: "開始廣播"
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "tab-vault"
- tapOn: "種子, tab, 2 of 4"
- extendedWaitUntil:
    visible: "產生種子"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "vault-phrase-dev-local"
    direction: DOWN
    timeout: 25000
    centerElement: true
    visibilityPercentage: 100
- tapOn:
    id: "vault-phrase-dev-local"
- extendedWaitUntil:
    visible:
      id: "vault-phrase-sheet"
    timeout: 20000
- assertVisible: "複製助記詞"
- takeScreenshot: phrase-overlay
- tapOn: "複製助記詞"
- assertVisible: "複製助記詞？"
- tapOn: "確認"
- tapOn:
    id: "sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "vault-phrase-sheet"
    timeout: 8000
- tapOn:
    id: "vault-accounts-dev-local"
- assertVisible:
    id: "vault-accounts-sheet"
- extendedWaitUntil:
    notVisible: "載入中"
    timeout: 30000
- assertVisible: "Ethereum / EVM"
- takeScreenshot: accounts-overlay
- tapOn:
    id: "sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "vault-accounts-sheet"
    timeout: 15000
- scrollUntilVisible:
    element: "Personal, SLIP39 1-of-1"
    direction: UP
    timeout: 20000
    visibilityPercentage: 80
- tapOn: "Personal, SLIP39 1-of-1"
- extendedWaitUntil:
    notVisible:
      id: "vault-phrase-dev-local"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "載入中"
    timeout: 30000
- tapOn:
    text: "顯示助記詞"
    below: "Personal, SLIP39 1-of-1"
- extendedWaitUntil:
    visible: "OK"
    timeout: 8000
- takeScreenshot: slip39-alert
- tapOn: "OK"
