appId: hk.ysk.cws
tags:
  - vault
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "disclaimer-agree"
    timeout: 15000
    optional: true
- tapOn:
    id: "disclaimer-agree"
    optional: true
- tapOn:
    id: "legal-tab-privacy"
    optional: true
- tapOn:
    id: "privacy-agree"
    optional: true
- tapOn:
    id: "disclaimer-continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-device"
    timeout: 45000
- extendedWaitUntil:
    visible: "開始廣播"
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "tab-vault"
- tapOn: "種子, tab, 2 of 4"
- extendedWaitUntil:
    visible:
      id: "vault-generate"
    timeout: 15000
- tapOn:
    id: "vault-import"
- extendedWaitUntil:
    visible:
      id: "import-draft"
    timeout: 15000
- tapOn:
    id: "import-draft"
- inputText: "absent much beef salmon theme settle absorb festival fancy dinner tiny flavor"
- tapOn:
    id: "import-submit"
- extendedWaitUntil:
    visible: "顯示助記詞"
    timeout: 20000
- tapOn:
    id: "vault-phrase-selected"
    optional: true
- tapOn:
    text: "顯示助記詞"
    optional: true
- tapOn:
    text: "Show recovery phrase"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vault-phrase-sheet"
    timeout: 20000
- takeScreenshot: phrase-overlay
- tapOn:
    id: "sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "vault-phrase-sheet"
    timeout: 8000
- tapOn:
    id: "vault-accounts-selected"
    optional: true
- tapOn:
    text: "帳戶"
    optional: true
- tapOn:
    text: "Accounts"
    optional: true
- assertVisible:
    id: "vault-accounts-sheet"
- extendedWaitUntil:
    notVisible: "載入中"
    timeout: 30000
- assertVisible: "Ethereum / EVM"
- takeScreenshot: accounts-overlay
- tapOn:
    id: "sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "vault-accounts-sheet"
    timeout: 15000
