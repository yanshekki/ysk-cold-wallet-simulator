appId: hk.ysk.cws
tags:
  - vault
  - generate
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "disclaimer-agree"
    timeout: 15000
    optional: true
- tapOn:
    id: "disclaimer-agree"
    optional: true
- tapOn:
    id: "legal-tab-privacy"
    optional: true
- tapOn:
    id: "privacy-agree"
    optional: true
- tapOn:
    id: "disclaimer-continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-device"
    timeout: 45000
- tapOn:
    id: "tab-vault"
- tapOn:
    id: "vault-generate"
- tapOn:
    id: "generate-words-12"
- tapOn:
    id: "generate-run"
- extendedWaitUntil:
    visible:
      id: "generate-reveal"
    timeout: 30000
- tapOn:
    id: "screen-back"
- extendedWaitUntil:
    visible:
      id: "tab-vault"
    timeout: 15000
